# Render Blueprint.
# M0: passkey hello-world over HTTPS for phone testing.
# WEBAUTHN_ORIGIN / WEBAUTHN_RP_ID default to Render's RENDER_EXTERNAL_URL, so no env setup is needed.
# M5: merchant service. Uses the Neon dev branch until M11 (D19). Secrets are sync: false: set them in
# the Render dashboard, never here.
services:
  - type: web
    name: handshake-passkey
    runtime: node
    plan: free
    region: ohio
    buildCommand: npx -y pnpm@10.34.9 install --frozen-lockfile --filter @handshake/passkey-hello
    startCommand: node apps/passkey-hello/src/server.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"

  - type: web
    name: handshake-merchant
    runtime: node
    plan: free
    region: ohio
    # NODE_ENV is set only at start: at build time it would make pnpm skip devDependencies (prisma).
    # Committed migrations are applied on every deploy (idempotent) via DIRECT_URL.
    # The env check runs first so a missing dashboard variable is named in the log.
    buildCommand: >-
      node scripts/require-env.mjs DATABASE_URL DIRECT_URL PAYPAL_CLIENT_ID PAYPAL_CLIENT_SECRET
      PAYPAL_WEBHOOK_ID MERCHANT_AGENT_ID MERCHANT_AGENT_PRIVATE_KEY MERCHANT_ADMIN_TOKEN WEB_URL
      WEBAUTHN_ORIGIN WEBAUTHN_RP_ID LLM_API_KEY &&
      npx -y pnpm@10.34.9 install --frozen-lockfile --filter "@handshake/merchant..." &&
      npx -y pnpm@10.34.9 --filter @handshake/db exec prisma migrate deploy
    startCommand: NODE_ENV=production npx -y pnpm@10.34.9 --filter @handshake/merchant start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Fixed, not secrets: pinned so the dashboard can't point at live PayPal or enable the simulator.
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: MERCHANT_AGENT_ID
        sync: false
      - key: MERCHANT_AGENT_PRIVATE_KEY
        sync: false
      # M7 gate: admin token for /orders/:id/fulfil, wallet origin for passkeys and PayPal return
      # pages, and the risk inspector's LLM.
      - key: MERCHANT_ADMIN_TOKEN
        sync: false
      - key: WEB_URL
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
