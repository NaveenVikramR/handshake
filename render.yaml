# Render Blueprint.
# M0: passkey hello-world over HTTPS for phone testing.
# WEBAUTHN_ORIGIN / WEBAUTHN_RP_ID default to Render's RENDER_EXTERNAL_URL, so no env setup is needed.
# M8 adds the wallet web app as `handshake-web`. Render gave it https://handshake-web-debi.onrender.com
# (the bare name was taken): that host is the WebAuthn origin and RP ID on the merchant and the consumer.
# M5: merchant service. Uses the Neon dev branch until M11 (D19). Secrets are sync: false: set them in
# the Render dashboard, never here.
services:
  - type: web
    name: handshake-passkey
    runtime: node
    plan: free
    region: ohio
    buildCommand: npx -y pnpm@10.34.9 install --frozen-lockfile --filter @handshake/passkey-hello
    startCommand: node apps/passkey-hello/src/server.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"

  - type: web
    name: handshake-merchant
    runtime: node
    plan: free
    region: ohio
    # NODE_ENV is set only at start: at build time it would make pnpm skip devDependencies (prisma).
    # Committed migrations are applied on every deploy (idempotent) via DIRECT_URL.
    # The env check runs first so a missing dashboard variable is named in the log.
    buildCommand: >-
      node scripts/require-env.mjs DATABASE_URL DIRECT_URL PAYPAL_CLIENT_ID PAYPAL_CLIENT_SECRET
      PAYPAL_WEBHOOK_ID MERCHANT_AGENT_ID MERCHANT_AGENT_PRIVATE_KEY MERCHANT_ADMIN_TOKEN WEB_URL
      WEBAUTHN_ORIGIN WEBAUTHN_RP_ID LLM_API_KEY DEMO_SECRET &&
      npx -y pnpm@10.34.9 install --frozen-lockfile --filter "@handshake/merchant..." &&
      npx -y pnpm@10.34.9 --filter @handshake/db exec prisma migrate deploy
    startCommand: NODE_ENV=production npx -y pnpm@10.34.9 --filter @handshake/merchant start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Fixed, not secrets: pinned so the dashboard can't point at live PayPal.
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      # D26: the deployed demo (Neon dev until M11) has the dashboard's Reset demo and Simulate webhook.
      # Simulated events never change an order; reset needs the admin token. Revisit for M11 (main).
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_SECRET
        sync: false
      # The host part of the dev DATABASE_URL: reset is offered only while DATABASE_URL points there.
      - key: DEMO_DATABASE_HOST
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: MERCHANT_AGENT_ID
        sync: false
      - key: MERCHANT_AGENT_PRIVATE_KEY
        sync: false
      # M7 gate: admin token for /orders/:id/fulfil, wallet origin for passkeys and PayPal return
      # pages, and the risk inspector's LLM. The origin values aren't secrets: pinned here (D27) so a
      # Blueprint sync keeps them equal to the consumer's.
      - key: MERCHANT_ADMIN_TOKEN
        sync: false
      - key: WEB_URL
        value: https://handshake-web-debi.onrender.com
      - key: WEBAUTHN_ORIGIN
        value: https://handshake-web-debi.onrender.com
      - key: WEBAUTHN_RP_ID
        value: handshake-web-debi.onrender.com
      - key: WEBAUTHN_RP_NAME
        value: Handshake
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false

  # M8: wallet + phone approval + merchant dashboard, served at https://handshake-web-debi.onrender.com
  # (Render's URL for this service), which is the WebAuthn origin and RP ID everywhere.
  - type: web
    name: handshake-web
    runtime: node
    plan: free
    region: ohio
    buildCommand: >-
      node scripts/require-env.mjs CONSUMER_URL MERCHANT_URL MERCHANT_ADMIN_TOKEN DEMO_SECRET &&
      npx -y pnpm@10.34.9 install --frozen-lockfile --filter "@handshake/web..." &&
      npx -y pnpm@10.34.9 --filter @handshake/web build
    startCommand: NODE_ENV=production npx -y pnpm@10.34.9 --filter @handshake/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: CONSUMER_URL
        value: https://handshake-consumer.onrender.com
      - key: MERCHANT_URL
        value: https://handshake-merchant.onrender.com
      # The same values as on handshake-merchant: the web server adds them to dashboard calls.
      - key: MERCHANT_ADMIN_TOKEN
        sync: false
      - key: DEMO_SECRET
        sync: false

  # M8: consumer agent + wallet API, reached only through handshake-web's server routes.
  - type: web
    name: handshake-consumer
    runtime: node
    plan: free
    region: ohio
    buildCommand: >-
      node scripts/require-env.mjs DATABASE_URL CONSUMER_AGENT_ID CONSUMER_AGENT_PRIVATE_KEY LLM_API_KEY &&
      npx -y pnpm@10.34.9 install --frozen-lockfile --filter "@handshake/consumer..."
    startCommand: NODE_ENV=production npx -y pnpm@10.34.9 --filter @handshake/consumer start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: WEBAUTHN_ORIGIN
        value: https://handshake-web-debi.onrender.com
      - key: WEBAUTHN_RP_ID
        value: handshake-web-debi.onrender.com
      - key: WEBAUTHN_RP_NAME
        value: Handshake
      - key: WEB_URL
        value: https://handshake-web-debi.onrender.com
      - key: MERCHANT_URL
        value: https://handshake-merchant.onrender.com
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      # D28: the dashboard's attack demo; the same DEMO_SECRET as the merchant and web. Revisit for M11.
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_SECRET
        sync: false
      # Same Neon dev branch as the merchant (D19); the merchant's build applies migrations.
      - key: DATABASE_URL
        sync: false
      - key: CONSUMER_AGENT_ID
        sync: false
      - key: CONSUMER_AGENT_PRIVATE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
